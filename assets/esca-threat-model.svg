    <text x="16" y="54" font-size="18" font-weight="700" fill="#1E1A14">Expression</text>
    <rect y="105" width="174" height="80" fill="#F9F6EF" stroke="#BFB49D"/>
    <text x="16" y="130" font-size="11" letter-spacing="1.2" fill="#235165">PRESERVE</text>
    <text x="16" y="159" font-size="18" font-weight="700" fill="#1E1A14">Identity</text>
    <rect y="210" width="174" height="80" fill="#9C4A2A"/>
    <text x="16" y="235" font-size="11" letter-spacing="1.2" fill="#F9F6EF">SECURITY CHECK</text>
    <text x="16" y="264" font-size="15" font-weight="700" fill="#F9F6EF">Liveness risk?</text>
  </g>
  <g font-family="Georgia, serif" fill="#4A4338">
