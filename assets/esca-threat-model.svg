    <text x="19" y="171" font-size="10" fill="#EAE3D3">z + expression-conditioned Δ</text>
  </g>
  <g fill="none" stroke="#235165" stroke-width="2"><path d="M471 246h67"/><path d="m530 239 8 7-8 7"/></g>
  <g transform="translate(547 117)" font-family="Arial, sans-serif">
    <rect width="174" height="80" fill="#F9F6EF" stroke="#BFB49D"/>
