<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">ESCA 3D face liveness threat model</title>
  <desc id="desc">A transformer maps expression changes into a 3D face representation, then evaluates liveness bypass and identity preservation as competing objectives.</desc>
  <rect width="760" height="500" fill="#EAE3D3"/>
  <g stroke="#235165" stroke-width="1" opacity=".18"><path d="M0 50h760M0 100h760M0 150h760M0 200h760M0 250h760M0 300h760M0 350h760M0 400h760M0 450h760"/><path d="M50 0v500M100 0v500M150 0v500M200 0v500M250 0v500M300 0v500M350 0v500M400 0v500M450 0v500M500 0v500M550 0v500M600 0v500M650 0v500M700 0v500"/></g>
  <g font-family="Arial, sans-serif" fill="#1E1A14">
