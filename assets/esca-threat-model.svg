    <text x="24" y="246" font-family="monospace" font-size="11" fill="#4A4338" stroke="none">ENCODER → NEUTRAL z</text>
  </g>
  <g fill="none" stroke="#235165" stroke-width="2"><path d="M230 246h66"/><path d="m288 239 8 7-8 7"/></g>
  <g transform="translate(297 151)" font-family="Arial, sans-serif">
